<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма</title>
</head>

<body>
    <main>
        <h1>Регистрация</h1>
        <p> Уже есть аккаунт</p>
        <a href="https://example.com">Войти</a>
        <form action="#">

            <div>
                <label for="company"></label>
                <input type="text" name="company" id="company" placeholder="Название компании">
            </div>
            <div>
                <label for="name"></label>
                <input type="text" name="name" id="name" placeholder="Имя" required>
            </div>
            <div>
                <label for="surname"></label>
                <input type="text" name="surename" id="surename" placeholder="Фамилия" required>
            </div>
            <div>
                <label for="email">E-mail*</label>
                <input type="email" name="email" id="email" placeholder="Введите email" required>
            </div>
            <button> Зарегистрироваться</button>
            <div>
                <label>
                    <input type="checkbox" name="agree">
                    Я прочитал и принимаю
                </label>
                <a href="https://example.com">Условия использования</a>
            </div>
        </form>
    </main>
</body>

</html>
